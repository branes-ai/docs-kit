# Builds a docs-kit site as the deploy does, and checks it: the sync fails on a
# broken link or anchor in docs/, and `docs-kit check` on one in the built
# HTML. The PR job of every repo with a docs site:
#
#   - uses: actions/checkout@<sha>
#     with:
#       persist-credentials: false
#   - uses: branes-ai/docs-kit/actions/check@<sha>
#
# The generator's version is the site's (docs-site/package.json); this action
# only runs it, through the site's npm scripts (build, check), so the site's
# own hooks run too: a `prebuild` script runs before the build, for assets the
# pages need (generated figures, a WebAssembly module).
name: Check the docs site
description: Builds a docs-kit site as the deploy does and checks every link and anchor in it.
inputs:
  path:
    description: The site's folder, relative to the workspace.
    default: docs-site
  node-version:
    description: The Node version to build with.
    default: '22'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.path }}/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.path }}
      run: npm ci --no-audit --no-fund
    - name: Build the site (sync from docs/, then Astro)
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        DEPLOY_TARGET: github-pages
      run: npm run build
    - name: Check every link and anchor in the built site
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        DEPLOY_TARGET: github-pages
      run: npm run check
